<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Luyện Thi & Đề Toán THPT KNTT - Cô Trúc</title>
    <!-- MathJax -->
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --accent: #e06d53; --bg: #fbf9f4; --card-bg: #ffffff;
            --text-dark: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --radius-lg: 16px; --radius-md: 10px; --radius-pill: 50px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }
        .wrapper { max-width: 1350px; margin: 0 auto; padding: 25px 20px; }
        
        .header { margin-bottom: 25px; }
        .header h1 { font-size: 2.1rem; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .header p { color: var(--text-muted); font-size: 1.05rem; }

        .grade-bar { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 20px; scrollbar-width: none; }
        .grade-bar::-webkit-scrollbar { display: none; }
        .grade-pill {
            background: #fff; border: 1px solid var(--border-color); padding: 9px 22px;
            border-radius: var(--radius-pill); font-weight: 700; font-size: 0.95rem;
            color: #475569; cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .grade-pill:hover { background: #f8fafc; }
        .grade-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px rgba(224, 109, 83, 0.3); }

        .portal-layout { display: grid; grid-template-columns: 290px 1fr; gap: 25px; align-items: start; }
        @media (max-width: 900px) { .portal-layout { grid-template-columns: 1fr; } }

        .sidebar { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px 14px; border: 1px solid #ede7dc; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .sidebar-title { font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .topic-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; padding-right: 4px; }
        .topic-group-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; color: #94a3b8; margin: 10px 0 4px 8px; letter-spacing: 0.5px; }
        .topic-item { padding: 8px 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600; color: #475569; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .topic-item:hover { background: #f1f5f9; color: var(--primary); }
        .topic-item.active { background: #e0f2fe; color: #0369a1; }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .exam-card { background: #fff; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid #f1ece1; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; flex-direction: column; transition: 0.25s; }
        .exam-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .card-banner { height: 130px; position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0d9488 0%, #0284c7 60%, #e11d48 100%); color: #fff; }
        .card-banner.exam-mode { background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%); }
        .card-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.95); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #0f172a; font-size: 1.4rem; }
        .card-badge { position: absolute; bottom: 8px; left: 10px; font-size: 0.72rem; font-weight: 700; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 4px; }
        .card-mode-badge { position: absolute; top: 10px; right: 10px; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #fff; }
        .mode-luyen-tap { color: #16a34a; }
        .mode-kiem-tra { color: #dc2626; }
        .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.05rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; line-height: 1.4; }
        .card-meta { display: flex; gap: 12px; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 14px; }
        .btn-start { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-start:hover { background: #1d4ed8; }

        #quiz-view { display: none; max-width: 900px; margin: 0 auto; background: #fff; padding: 25px 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: 0 6px 25px rgba(0,0,0,0.05); }
        .quiz-topbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
        .btn-back { background: #f1f5f9; border: none; padding: 7px 14px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }
        .timer-box { font-size: 1.15rem; font-weight: 800; color: #dc2626; background: #fee2e2; padding: 6px 14px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 6px; }
        .anti-cheat-alert { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; display: none; }
        .student-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .student-box input { padding: 10px 12px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; }

        .section-header { background: #f1f5f9; padding: 10px 14px; border-radius: 8px; font-weight: 700; color: #0f172a; margin: 25px 0 12px; font-size: 1rem; border-left: 4px solid var(--primary); }
        .q-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; margin-bottom: 15px; }
        .q-title { font-weight: 700; margin-bottom: 12px; color: #0f172a; line-height: 1.5; }
        .mcq-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
        .mcq-option:hover { background: #f0f7ff; border-color: var(--primary); }
        
        .tf-row { border-bottom: 1px dashed #cbd5e1; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .tf-btns label { margin-left: 14px; font-weight: 600; cursor: pointer; }

        .sa-input { width: 220px; padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 1rem; margin-top: 8px; }
        .btn-submit { width: 100%; padding: 14px; background: #16a34a; color: #fff; border: none; border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #15803d; }
        #quiz-result { display: none; margin-top: 20px; padding: 20px; border-radius: var(--radius-md); text-align: center; font-size: 1.15rem; font-weight: 700; background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div id="portal-view" class="wrapper">
        <div class="header">
            <h1>Cổng Luyện Thi & Đề Toán THPT KNTT</h1>
            <p>Hệ thống học tập chuẩn SGK Kết Nối Tri Thức — Cô Trúc</p>
        </div>

        <div class="grade-bar">
            <button class="grade-pill active" onclick="filterGrade('all', this)">Tất cả</button>
            <button class="grade-pill" onclick="filterGrade('12', this)">Toán 12</button>
            <button class="grade-pill" onclick="filterGrade('11', this)">Toán 11</button>
            <button class="grade-pill" onclick="filterGrade('10', this)">Toán 10</button>
            <button class="grade-pill" onclick="filterGrade('thpt', this)">Luyện Thi THPT QG</button>
        </div>

        <div class="portal-layout">
            <aside class="sidebar">
                <div class="sidebar-title"><i class="fa-solid fa-shapes"></i> Danh Mục Chuyên Đề</div>
                <ul class="topic-list" id="topic-container">
                    <!-- Được render tự động theo Khối -->
                </ul>
            </aside>

            <main>
                <div class="exam-grid" id="exam-grid">
                    <p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Đang tải danh sách đề từ Google Sheets...</p>
                </div>
            </main>
        </div>
    </div>

    <div id="quiz-view">
        <div class="quiz-topbar">
            <button class="btn-back" onclick="backToPortal()"><i class="fa-solid fa-arrow-left"></i> Trở về</button>
            <h3 id="quiz-title" style="color: #0f172a; font-size: 1.15rem;"></h3>
            <div class="timer-box" id="timer-display"><i class="fa-regular fa-clock"></i> <span id="time-left">15:00</span></div>
        </div>

        <div class="anti-cheat-alert" id="cheat-warning">
            <i class="fa-solid fa-triangle-exclamation"></i> <strong>Cảnh báo:</strong> Bạn vừa rời khỏi màn hình làm bài (<span id="cheat-count">0</span>/3 lần). Rời quá 3 lần bài thi sẽ tự động thu!
        </div>

        <div class="student-box">
            <input type="text" id="std-name" placeholder="Họ và tên học sinh *" required>
            <input type="text" id="std-class" placeholder="Lớp (Ví dụ: 12A1) *" required>
        </div>

        <form id="quiz-form">
            <div id="quiz-content"></div>
            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Nộp Bài & Xem Điểm</button>
        </form>

        <div id="quiz-result"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwdJByu3MKLejVJOUV-rX5mf6UKUst1J55IZbXT5bAG6QTgedWgF54yyJcgmk6hkcaIg/exec";

        let examBank = [];
        let currentGrade = 'all';
        let currentTopic = 'all';
        let activeExam = null;
        let timerInterval = null;
        let secondsRemaining = 0;
        let cheatWarnings = 0;

        // Cấu trúc chuyên đề chi tiết bám sách Kết Nối Tri Thức
        const topicsConfig = {
            general: [
                { id: 'all', name: 'Tất cả chuyên đề', icon: 'fa-layer-group' },
                { id: 'kttx-1', name: 'Kiểm tra thường xuyên 1', icon: 'fa-file-pen' },
                { id: 'kttx-2', name: 'Kiểm tra thường xuyên 2', icon: 'fa-file-pen' },
                { id: 'kttx-3', name: 'Kiểm tra thường xuyên 3', icon: 'fa-file-pen' },
                { id: 'giua-ki-1', name: 'Kiểm tra Giữa Kì 1', icon: 'fa-calendar-check' },
                { id: 'cuoi-ki-1', name: 'Kiểm tra Cuối Kì 1', icon: 'fa-graduation-cap' },
                { id: 'giua-ki-2', name: 'Kiểm tra Giữa Kì 2', icon: 'fa-calendar-check' },
                { id: 'cuoi-ki-2', name: 'Kiểm tra Cuối Kì 2', icon: 'fa-graduation-cap' },
                { id: 'thpt-qg', name: 'Luyện đề Tốt Nghiệp THPT', icon: 'fa-award' }
            ],
            g12: [
                { type: 'header', title: 'SGK Toán 12 (KNTT)' },
                { id: '12-ham-so', name: 'Chương 1: Ứng dụng đạo hàm & Khảo sát hàm số', icon: 'fa-chart-line' },
                { id: '12-vecto-khong-gian', name: 'Chương 2: Vectơ & Tọa độ trong không gian', icon: 'fa-location-arrow' },
                { id: '12-thong-ke', name: 'Chương 3: Thống kê số liệu ghép nhóm', icon: 'fa-chart-simple' },
                { id: '12-nguyen-ham-tich-phan', name: 'Chương 4: Nguyên hàm & Tích phân', icon: 'fa-infinity' },
                { id: '12-oxyz', name: 'Chương 5: Phương pháp tọa độ Oxyz', icon: 'fa-cube' },
                { id: '12-xac-suat', name: 'Chương 6: Xác suất có điều kiện', icon: 'fa-dice' },
                { type: 'header', title: 'Chuyên Đề Học Tập 12 (Nâng Cao)' },
                { id: '12-cd-bien-ngau-nhien', name: 'CĐ 1: Biến ngẫu nhiên rời rạc', icon: 'fa-arrow-trend-up' },
                { id: '12-cd-toan-toi-uu', name: 'CĐ 2: Bài toán tối ưu & Quy hoạch tuyến tính', icon: 'fa-bullseye' },
                { id: '12-cd-toan-tai-chinh', name: 'CĐ 3: Toán tài chính & Thực tế', icon: 'fa-coins' }
            ],
            g11: [
                { type: 'header', title: 'SGK Toán 11 (KNTT)' },
                { id: '11-luong-giac', name: 'Chương 1: Hàm số & PT Lượng giác', icon: 'fa-wave-square' },
                { id: '11-day-so-cap-so', name: 'Chương 2: Dãy số, Cấp số cộng & Nhân', icon: 'fa-arrow-up-right-dots' },
                { id: '11-thong-ke', name: 'Chương 3: Số đặc trưng mẫu số liệu', icon: 'fa-chart-pie' },
                { id: '11-song-song', name: 'Chương 4: Quan hệ song song không gian', icon: 'fa-bars' },
                { id: '11-gioi-han', name: 'Chương 5: Giới hạn & Hàm số liên tục', icon: 'fa-arrows-split-up-and-left' },
                { id: '11-mu-logarit', name: 'Chương 6: Hàm số Mũ & Logarit', icon: 'fa-square-root-variable' },
                { id: '11-dao-ham', name: 'Chương 7: Đạo hàm', icon: 'fa-chart-area' },
                { id: '11-vuong-goc', name: 'Chương 8: Quan hệ vuông góc không gian', icon: 'fa-shapes' },
                { id: '11-xac-suat', name: 'Chương 9: Xác suất biến cố giao, độc lập', icon: 'fa-dice-five' },
                { type: 'header', title: 'Chuyên Đề Học Tập 11 (Nâng Cao)' },
                { id: '11-cd-phep-bien-hinh', name: 'CĐ 1: Phép biến hình trong mặt phẳng', icon: 'fa-clone' },
                { id: '11-cd-ly-thuyet-do-thi', name: 'CĐ 2: Làm quen Lý thuyết đồ thị', icon: 'fa-diagram-project' },
                { id: '11-cd-ve-ky-thuat', name: 'CĐ 3: Một số yếu tố vẽ kĩ thuật', icon: 'fa-compass-drafting' }
            ],
            g10: [
                { type: 'header', title: 'SGK Toán 10 (KNTT)' },
                { id: '10-menh-de-tap-hop', name: 'Chương 1: Mệnh đề & Tập hợp', icon: 'fa-cubes' },
                { id: '10-bpt-he-bpt', name: 'Chương 2: BPT & Hệ BPT bậc nhất hai ẩn', icon: 'fa-table-cells-large' },
                { id: '10-he-thuc-luong', name: 'Chương 3: Hệ thức lượng trong tam giác', icon: 'fa-draw-polygon' },
                { id: '10-vecto', name: 'Chương 4: Vectơ', icon: 'fa-arrow-right' },
                { id: '10-thong-ke', name: 'Chương 5: Thống kê số liệu không ghép nhóm', icon: 'fa-chart-column' },
                { id: '10-ham-so-bac-hai', name: 'Chương 6: Hàm số bậc hai & Đồ thị', icon: 'fa-bezier-curve' },
                { id: '10-oxy', name: 'Chương 7: Phương pháp tọa độ Oxy', icon: 'fa-map-pin' },
                { id: '10-to-hop', name: 'Chương 8: Đại số tổ hợp & Nhị thức Newton', icon: 'fa-shuffle' },
                { id: '10-xac-suat', name: 'Chương 9: Tính xác suất cổ điển', icon: 'fa-dice-d6' },
                { type: 'header', title: 'Chuyên Đề Học Tập 10 (Nâng Cao)' },
                { id: '10-cd-he-phuong-trinh', name: 'CĐ 1: Hệ phương trình bậc nhất ba ẩn', icon: 'fa-table-list' },
                { id: '10-cd-quy-nap', name: 'CĐ 2: Quy nạp toán học & Nhị thức Newton', icon: 'fa-superscript' },
                { id: '10-cd-ba-duong-conic', name: 'CĐ 3: Ba đường Conic & Ứng dụng', icon: 'fa-circle-notch' }
            ]
        };

        function renderSidebarTopics() {
            const container = document.getElementById('topic-container');
            container.innerHTML = '';

            let list = [...topicsConfig.general];
            if (currentGrade === '12') list = [...topicsConfig.general, ...topicsConfig.g12];
            else if (currentGrade === '11') list = [...topicsConfig.general, ...topicsConfig.g11];
            else if (currentGrade === '10') list = [...topicsConfig.general, ...topicsConfig.g10];
            else if (currentGrade === 'thpt') list = [...topicsConfig.general, ...topicsConfig.g12];
            else list = [...topicsConfig.general, ...topicsConfig.g12, ...topicsConfig.g11, ...topicsConfig.g10];

            list.forEach(item => {
                if (item.type === 'header') {
                    const h = document.createElement('div');
                    h.className = 'topic-group-title';
                    h.innerText = item.title;
                    container.appendChild(h);
                } else {
                    const li = document.createElement('li');
                    li.className = `topic-item ${currentTopic === item.id ? 'active' : ''}`;
                    li.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.name}</span>`;
                    li.onclick = () => filterTopic(item.id, li);
                    container.appendChild(li);
                }
            });
        }

        async function fetchExams() {
            try {
                const res = await fetch(SCRIPT_URL);
                examBank = await res.json();
                renderSidebarTopics();
                renderExams();
            } catch (err) {
                document.getElementById('exam-grid').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #dc2626;">Đang tải hoặc chưa có dữ liệu. Vui lòng kiểm tra quyền chia sẻ bảng tính!</p>`;
            }
        }

        function renderExams() {
            const grid = document.getElementById('exam-grid');
            grid.innerHTML = '';

            const list = examBank.filter(e => {
                const gMatch = (currentGrade === 'all' || e.grade === currentGrade);
                const tMatch = (currentTopic === 'all' || e.topic === currentTopic);
                return gMatch && tMatch;
            });

            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px;">Chưa có đề nào trong mục này trên Google Sheets.</p>`;
                return;
            }

            list.forEach(ex => {
                const isExamMode = ex.mode === 'KIEMTRA';
                const card = document.createElement('div');
                card.className = 'exam-card';
                card.innerHTML = `
                    <div class="card-banner ${isExamMode ? 'exam-mode' : ''}">
                        <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
                        <div class="card-badge">KHỐI ${ex.grade.toUpperCase()}</div>
                        <div class="card-mode-badge ${isExamMode ? 'mode-kiem-tra' : 'mode-luyen-tap'}">
                            ${isExamMode ? '🔴 KIỂM TRA' : '🟢 LUYỆN TẬP'}
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            <h3 class="card-title">${ex.title}</h3>
                            <div class="card-meta">
                                <span><i class="fa-regular fa-circle-question"></i> ${ex.questions.length} câu</span>
                                <span><i class="fa-regular fa-clock"></i> ${ex.timeLimit} phút</span>
                            </div>
                        </div>
                        <button class="btn-start" onclick="startExam('${ex.id}')"><i class="fa-solid fa-play"></i> Bắt đầu</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGrade(g, btn) {
            currentGrade = g;
            currentTopic = 'all';
            document.querySelectorAll('.grade-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSidebarTopics();
            renderExams();
        }

        function filterTopic(t, item) {
            currentTopic = t;
            document.querySelectorAll('.topic-item').forEach(i => i.classList.remove('active'));
            if (item) item.classList.add('active');
            renderExams();
        }

        function startExam(id) {
            activeExam = examBank.find(e => e.id === id);
            if (!activeExam) return;

            document.getElementById('portal-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            document.getElementById('quiz-title').innerText = activeExam.title;
            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('cheat-warning').style.display = 'none';
            document.getElementById('quiz-form').reset();
            cheatWarnings = 0;

            if (activeExam.mode === 'KIEMTRA') {
                document.body.style.userSelect = 'none';
                window.onblur = handleWindowBlur;
            } else {
                document.body.style.userSelect = 'auto';
                window.onblur = null;
            }

            clearInterval(timerInterval);
            secondsRemaining = activeExam.timeLimit * 60;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsRemaining--;
                updateTimerDisplay();
                if (secondsRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Đã hết thời gian làm bài! Hệ thống tự động thu bài.");
                    submitQuiz();
                }
            }, 1000);

            const p1 = activeExam.questions.filter(q => q.type === 'MCQ');
            const p2 = activeExam.questions.filter(q => q.type === 'TF');
            const p3 = activeExam.questions.filter(q => q.type === 'SA');

            const container = document.getElementById('quiz-content');
            container.innerHTML = '';
            let qGlobalIdx = 0;

            if (p1.length > 0) {
                container.innerHTML += `<div class="section-header">🔷 PHẦN I: CÂU TRẮC NGHIỆM NHIỀU LỰA CHỌN (0.25 đ/câu)</div>`;
                p1.forEach(q => {
                    qGlobalIdx++;
                    let opts = '';
                    ['A', 'B', 'C', 'D'].forEach((ch, idx) => {
                        opts += `
                            <label class="mcq-option">
                                <input type="radio" name="q_${qGlobalIdx}" value="${ch}" required>
                                <span><strong>${ch}.</strong> ${q.options[idx]}</span>
                            </label>
                        `;
                    });
                    container.innerHTML += `<div class="q-card"><div class="q-title">Câu ${qGlobalIdx}: ${q.q}</div>${opts}</div>`;
                });
            }

            if (p2.length > 0) {
                container.innerHTML += `<div class="section-header">🔷 PHẦN II: CÂU TRẮC NGHIỆM ĐÚNG / SAI (Tối đa 1.0 đ/câu)</div>`;
                p2.forEach(q => {
                    qGlobalIdx++;
                    let rows = '';
                    ['a', 'b', 'c', 'd'].forEach((ch, idx) => {
                        rows += `
                            <div class="tf-row">
                                <span><strong>${ch})</strong> ${q.options[idx]}</span>
                                <div class="tf-btns">
                                    <label><input type="radio" name="q_${qGlobalIdx}_${ch}" value="D" required> Đúng</label>
                                    <label><input type="radio" name="q_${qGlobalIdx}_${ch}" value="S" required> Sai</label>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML += `<div class="q-card"><div class="q-title">Câu ${qGlobalIdx}: ${q.q}</div>${rows}</div>`;
                });
            }

            if (p3.length > 0) {
                container.innerHTML += `<div class="section-header">🔷 PHẦN III: CÂU TRẮC NGHIỆM TRẢ LỜI NGẮN (0.5 đ/câu)</div>`;
                p3.forEach(q => {
                    qGlobalIdx++;
                    container.innerHTML += `
                        <div class="q-card">
                            <div class="q-title">Câu ${qGlobalIdx}: ${q.q}</div>
                            <input type="text" class="sa-input" name="q_${qGlobalIdx}" placeholder="Nhập đáp án số..." required>
                        </div>
                    `;
                });
            }

            if (window.MathJax) MathJax.typesetPromise();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleWindowBlur() {
            if (activeExam && activeExam.mode === 'KIEMTRA') {
                cheatWarnings++;
                document.getElementById('cheat-warning').style.display = 'block';
                document.getElementById('cheat-count').innerText = cheatWarnings;
                if (cheatWarnings >= 3) {
                    alert("Bạn đã rời khỏi màn hình thi 3 lần! Bài thi sẽ tự động kết thúc.");
                    submitQuiz();
                }
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(secondsRemaining / 60);
            const s = secondsRemaining % 60;
            document.getElementById('time-left').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function backToPortal() {
            clearInterval(timerInterval);
            window.onblur = null;
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('portal-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('quiz-form').addEventListener('submit', function(e) {
            e.preventDefault();
            submitQuiz();
        });

        function submitQuiz() {
            clearInterval(timerInterval);
            window.onblur = null;

            const name = document.getElementById('std-name').value.trim() || "Ẩn danh";
            const sClass = document.getElementById('std-class').value.trim() || "Tự do";

            let p1Score = 0, p2Score = 0, p3Score = 0;
            let qIdx = 0;

            activeExam.questions.forEach(q => {
                qIdx++;
                if (q.type === 'MCQ') {
                    const sel = document.querySelector(`input[name="q_${qIdx}"]:checked`)?.value;
                    if (sel && sel.toUpperCase() === q.answer.toUpperCase()) p1Score += 0.25;
                } else if (q.type === 'TF') {
                    const cleanAns = q.answer.replace(/[^DSds]/g, '').toUpperCase();
                    let cCount = 0;
                    ['a', 'b', 'c', 'd'].forEach((ch, idx) => {
                        const sel = document.querySelector(`input[name="q_${qIdx}_${ch}"]:checked`)?.value;
                        if (sel && sel === cleanAns[idx]) cCount++;
                    });
                    if (cCount === 1) p2Score += 0.1;
                    else if (cCount === 2) p2Score += 0.25;
                    else if (cCount === 3) p2Score += 0.5;
                    else if (cCount === 4) p2Score += 1.0;
                } else if (q.type === 'SA') {
                    const rawVal = document.querySelector(`input[name="q_${qIdx}"]`)?.value.trim() || "";
                    const sVal = rawVal.replace(/\s+/g, '').replace(',', '.');
                    const validList = q.answer.split(/[|;]/).map(a => a.trim().replace(/\s+/g, '').replace(',', '.'));
                    if (validList.includes(sVal) && sVal !== "") p3Score += 0.5;
                }
            });

            const totalScore = (p1Score + p2Score + p3Score).toFixed(2);
            const resDiv = document.getElementById('quiz-result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `🎉 Điểm số của bạn: <strong>${totalScore} / 10</strong><br><small>(P.I: ${p1Score.toFixed(2)}đ | P.II: ${p2Score.toFixed(2)}đ | P.III: ${p3Score.toFixed(2)}đ)</small>`;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    time: new Date().toLocaleString("vi-VN"),
                    examId: activeExam.id,
                    examTitle: activeExam.title,
                    name: name,
                    class: sClass,
                    mode: activeExam.mode,
                    p1Score: p1Score.toFixed(2),
                    p2Score: p2Score.toFixed(2),
                    p3Score: p3Score.toFixed(2),
                    totalScore: totalScore
                })
            });
        }

        renderSidebarTopics();
        fetchExams();
    </script>
</body>
</html>
