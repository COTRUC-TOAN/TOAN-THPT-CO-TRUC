<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đấu Trường Toán Học - Mr. Trúc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cấu hình MathJax 3 hiển thị công thức toán -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 680px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    .text-center { text-align: center; }
    
    /* Giao diện Đăng ký */
    .title-banner {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #94a3b8; }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus { border-color: var(--primary); }
    
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Thanh Header Đấu trường */
    .arena-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: #334155;
      font-weight: 700;
      font-size: 14px;
    }
    .combo-badge {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .score-badge { color: #4ade80; }

    /* Thanh thời gian */
    .timer-track {
      height: 10px;
      width: 100%;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: #38bdf8;
      transition: width 1s linear, background-color 0.3s;
    }

    /* Câu hỏi & Đáp án */
    .question-box {
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #38bdf8;
      background: #273549;
    }
    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--success) !important;
      color: #86efac !important;
    }
    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
    }

    /* Popup điểm nổi */
    #score-popup {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 32px;
      font-weight: 800;
      pointer-events: none;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }
    #score-popup.active {
      opacity: 1;
      transform: translate(-50%, -60px);
    }

    /* Bảng xếp hạng */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 15px;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    .leaderboard-table th { color: #94a3b8; font-weight: 600; }
    .rank-1 { color: #facc15; font-weight: 800; }
    .rank-2 { color: #e2e8f0; font-weight: 700; }
    .rank-3 { color: #fb923c; font-weight: 700; }
  </style>
</head>
<body>

<div class="container">
  <!-- POPUP ĐIỂM SỐ BAY LÊN -->
  <div id="score-popup"></div>

  <!-- MÀN HÌNH 1: ĐĂNG KÝ VÀO THI -->
  <div id="screen-login" class="card">
    <h1 class="title-banner text-center">⚔️ ĐẤU TRƯỜNG TOÁN HỌC ⚔️</h1>
    <div class="input-group">
      <label>Họ và tên thí sinh:</label>
      <input type="text" id="player-name" placeholder="Nhập họ và tên...">
    </div>
    <div class="input-group">
      <label>Lớp / Trường:</label>
      <input type="text" id="player-class" placeholder="Ví dụ: 12A1">
    </div>
    <button class="btn" id="btn-start" onclick="startLoading()">VÀO TRẬN ĐẤU</button>
  </div>

  <!-- MÀN HÌNH 2: GIAO DIỆN THI ĐẤU -->
  <div id="screen-game" class="card" style="display: none;">
    <div class="arena-header">
      <div class="badge">Câu: <span id="current-q">1</span>/<span id="total-q">10</span></div>
      <div id="streak-badge" class="badge combo-badge">🔥 Combo x1</div>
      <div class="badge score-badge">Điểm: <span id="score-display">0</span></div>
    </div>
    <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    
    <div id="question-text" class="question-box"></div>
    <div id="options-container" class="options-grid"></div>
  </div>

  <!-- MÀN HÌNH 3: KẾT QUẢ & BẢNG XẾP HẠNG -->
  <div id="screen-result" class="card" style="display: none;">
    <h2 class="text-center" style="color: #facc15; margin-bottom: 12px;">🏆 TỔNG KẾT TRẬN ĐẤU 🏆</h2>
    <div class="text-center" id="final-stats" style="font-size: 17px; line-height: 1.6; margin-bottom: 24px;"></div>
    
    <h3 style="color: #38bdf8; margin-top: 10px;">🌟 BẢNG VÀNG TOP 10</h3>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>Hạng</th>
          <th>Thí sinh</th>
          <th>Điểm số</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
    <br>
    <button class="btn" onclick="location.reload()">ĐẤU LẠI LƯỢT MỚI</button>
  </div>
</div>

<script>
  // 1. LIÊN KẾT GOOGLE APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmV_0WaIHlMNdL1Ygj6Y3khwMAVqoOVAHf5D9N_2vY5QGZ_4s0yJv9iW1f0o3/exec"; 

  // 2. BIẾN QUẢN LÝ TRẬN ĐẤU
  let questions = [];
  let currentIndex = 0;
  let score = 0;
  let streak = 0;
  let timerInterval = null;
  let QUESTION_TIME = 15;
  let timeLeft = QUESTION_TIME;
  let totalTimeSpent = 0;
  let examCode = "thu";

  // Lấy mã đề từ URL (?exam=...)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('exam')) {
    examCode = urlParams.get('exam').trim();
  }

  // 3. BỘ PHÁT ÂM THANH WEB AUDIO API SỐNG ĐỘNG
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(70, now + 0.3);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'tick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'victory') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, now + idx * 0.12);
        g.gain.setValueAtTime(0.2, now + idx * 0.12);
        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.5);
        o.start(now + idx * 0.12); o.stop(now + idx * 0.12 + 0.5);
      });
    }
  }

  // 4. LÀM SẠCH KÝ TỰ RÁC
  function cleanMathText(str) {
    if (!str) return "";
    return str
      .replace(/^<\/b>/i, '')
      .replace(/<\/?o:p>/gi, '')
      .replace(/\n/g, '<br>');
  }

  // 5. TẢI ĐỀ THI TỪ GOOGLE SHEETS
  async function startLoading() {
    const name = document.getElementById("player-name").value.trim();
    const className = document.getElementById("player-class").value.trim();
    
    if (!name || !className) {
      alert("Vui lòng điền đầy đủ Họ tên và Lớp!");
      return;
    }

    const btn = document.getElementById("btn-start");
    btn.innerText = "Đang tải dữ liệu...";
    btn.disabled = true;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getExam&exam=${encodeURIComponent(examCode)}`);
      const result = await res.json();

      if (result.status === "success" && result.data && result.data.length > 0) {
        questions = result.data;
        if (result.timeLimit) QUESTION_TIME = Number(result.timeLimit);

        document.getElementById("screen-login").style.display = "none";
        document.getElementById("screen-game").style.display = "block";
        document.getElementById("total-q").innerText = questions.length;
        renderQuestion();
      } else {
        alert(result.message || "Không tìm thấy mã đề: " + examCode);
        btn.innerText = "VÀO TRẬN ĐẤU";
        btn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      alert("Lỗi kết nối máy chủ Google Sheets!");
      btn.innerText = "VÀO TRẬN ĐẤU";
      btn.disabled = false;
    }
  }

  // 6. HIỂN THỊ CÂU HỎI
  function renderQuestion() {
    if (currentIndex >= questions.length) {
      endGame();
      return;
    }

    const q = questions[currentIndex];
    document.getElementById("current-q").innerText = currentIndex + 1;
    document.getElementById("question-text").innerHTML = `<b>Câu ${currentIndex + 1}:</b> ${cleanMathText(q.q || q.question)}`;

    const labels = ['A', 'B', 'C', 'D'];
    const container = document.getElementById("options-container");
    
    let opts = [];
    if (Array.isArray(q.options)) {
      opts = q.options;
    } else {
      opts = [q.a, q.b, q.c, q.d];
    }

    container.innerHTML = opts.map((optText, index) => {
      const letter = labels[index];
      return `
        <button class="option-btn" data-key="${letter}" onclick="submitAnswer('${letter}', this)">
          <b>${letter}.</b> <span>${cleanMathText(optText)}</span>
        </button>
      `;
    }).join('');

    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise();
    }

    startTimer();
  }

  // 7. BỘ ĐẾM GIỜ
  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = QUESTION_TIME;
    updateTimerUI();

    timerInterval = setInterval(() => {
      timeLeft--;
      totalTimeSpent++;
      updateTimerUI();

      if (timeLeft <= 3 && timeLeft > 0) {
        playSound('tick');
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitAnswer(null, null);
      }
    }, 1000);
  }

  function updateTimerUI() {
    const percent = (timeLeft / QUESTION_TIME) * 100;
    const bar = document.getElementById("timer-fill");
    if (bar) {
      bar.style.width = percent + "%";
      if (percent < 30) bar.style.backgroundColor = "var(--danger)";
      else if (percent < 60) bar.style.backgroundColor = "var(--warning)";
      else bar.style.backgroundColor = "#38bdf8";
    }
  }

  // 8. CHẤM ĐIỂM TỐC ĐỘ VÀ COMBO
  function submitAnswer(selectedKey, btnEl) {
    clearInterval(timerInterval);
    const q = questions[currentIndex];
    const correctKey = (q.ans || q.correct || '').toString().trim().toUpperCase();
    const isCorrect = (selectedKey === correctKey);

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(b => b.disabled = true);

    if (isCorrect) {
      streak++;
      const base = 1000;
      const speedBonus = Math.round(base * (timeLeft / QUESTION_TIME));
      
      let multiplier = 1.0;
      if (streak >= 5) multiplier = 1.5;
      else if (streak >= 3) multiplier = 1.2;

      const earned = Math.round((base + speedBonus) * multiplier);
      score += earned;

      if (btnEl) btnEl.classList.add("correct");
      playSound('correct');
      showPopup(`+${earned.toLocaleString()} đ (x${multiplier})`, '#4ade80');
    } else {
      streak = 0;
      if (btnEl) btnEl.classList.add("wrong");
      buttons.forEach(b => {
        if (b.getAttribute("data-key") === correctKey) b.classList.add("correct");
      });
      playSound('wrong');
      showPopup("Sai rồi! +0 đ", '#ef4444');
    }

    document.getElementById("score-display").innerText = score.toLocaleString();
    const streakBadge = document.getElementById("streak-badge");
    if (streakBadge) streakBadge.innerText = `🔥 Combo x${streak > 1 ? streak : 1}`;

    setTimeout(() => {
      currentIndex++;
      renderQuestion();
    }, 1200);
  }

  function showPopup(text, color) {
    const popup = document.getElementById("score-popup");
    if (!popup) return;
    popup.innerText = text;
    popup.style.color = color;
    popup.classList.add("active");
    setTimeout(() => popup.classList.remove("active"), 800);
  }

  // 9. KẾT THÚC & LƯU ĐIỂM
  async function endGame() {
    playSound('victory');
    document.getElementById("screen-game").style.display = "none";
    document.getElementById("screen-result").style.display = "block";

    const name = document.getElementById("player-name").value.trim();
    const className = document.getElementById("player-class").value.trim();

    document.getElementById("final-stats").innerHTML = `
      Thí sinh: <b>${name}</b> | Lớp: <b>${className}</b><br>
      Tổng điểm: <b style="color:#4ade80; font-size:26px;">${score.toLocaleString()}</b> điểm<br>
      Tổng thời gian: <b>${totalTimeSpent}</b> giây
    `;

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          exam: examCode,
          name: name,
          className: className,
          score: score,
          timeSpent: totalTimeSpent
        })
      });
    } catch (e) {
      console.error("Lỗi lưu kết quả:", e);
    }

    fetchLeaderboard();
  }

  // 10. LẤY BẢNG XẾP HẠNG
  async function fetchLeaderboard() {
    const tbody = document.getElementById("leaderboard-body");
    if (!tbody) return;
    tbody.innerHTML = "<tr><td colspan='4'>Đang tải bảng xếp hạng...</td></tr>";

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getLeaderboard&exam=${encodeURIComponent(examCode)}`);
      const result = await res.json();

      if (result.status === "success" && result.data && result.data.length > 0) {
        tbody.innerHTML = result.data.map((p, idx) => `
          <tr>
            <td class="${idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : ''}">
              ${idx === 0 ? '🥇 1' : idx === 1 ? '🥈 2' : idx === 2 ? '🥉 3' : idx + 1}
            </td>
            <td><b>${p.name}</b> (${p.className})</td>
            <td><b style="color:#4ade80">${p.score.toLocaleString()}</b></td>
            <td>${p.timeSpent}s</td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = "<tr><td colspan='4'>Chưa có dữ liệu thi đấu!</td></tr>";
      }
    } catch (e) {
      tbody.innerHTML = "<tr><td colspan='4'>Không thể tải bảng xếp hạng.</td></tr>";
    }
  }
</script>
</body>
</html>
