<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Khảo Thí & Học Tập Toán THPT - Cô Trúc</title>
    <!-- Phông chữ chuẩn tiếng Việt & Toán học -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <!-- MathJax Cấu Hình Tinh Chỉnh Công Thức Mượt & Chuẩn Tỷ Lệ -->
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']], 
                displayMath: [['$$', '$$'], ['\\[', '\\]']], 
                processEscapes: true 
            },
            chtml: { 
                scale: 1.05, 
                displayAlign: 'center',
                matchFontHeight: true
            },
            options: { 
                enableMenu: false 
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8; --accent: #ea580c; --bg: #f8fafc; --card-bg: #ffffff;
            --text-dark: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --radius-lg: 16px; --radius-md: 10px; --radius-pill: 50px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); min-height: 100vh; padding-bottom: 50px; }
        
        /* Tối ưu ảnh đồ thị / bảng biến thiên trong đề bài */
        .q-card img, .bank-q-item img, .preview-box img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px auto;
            display: block;
            border: 1px solid #e2e8f0;
        }

        /* Tinh chỉnh công thức Toán học đều nét, không bị lệch dòng */
        mjx-container[jax="CHTML"][display="false"] {
            margin: 0 0.15em !important;
            vertical-align: -0.1em !important;
        }
    </style>
</head>
