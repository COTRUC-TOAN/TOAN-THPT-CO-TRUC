<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Toán THPT</title>
  
  <!-- MathJax cấu hình công thức Toán chuẩn LaTeX -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 750px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 {
      color: #1a73e8;
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }
    .student-info {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }
    .student-info input {
      padding: 12px 14px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }
    .student-info input:focus {
      border-color: #1a73e8;
    }
    #fullname { flex: 1; }
    #classname { width: 140px; }
    
    .question-card {
      background: #fafafa;
      border: 1px solid #e4e6eb;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .question-title {
      font-weight: 600;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #dadce0;
      transition: all 0.2s;
    }
    .options label:hover {
      background: #f1f3f4;
      border-color: #1a73e8;
    }
    .options input[type="radio"] {
      transform: scale(1.2);
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button.submit-btn:hover {
      background: #1557b0;
    }
    button.submit-btn:disabled {
      background: #a8c7fa;
      cursor: not-allowed;
    }
    #result-box {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #e6f4ea;
      border: 1px solid #34a853;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #137333;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>PHIẾU ÔN TẬP TOÁN THPT</h1>
  
  <div class="student-info">
    <input type="text" id="fullname" placeholder="Họ và tên học sinh..." required>
    <input type="text" id="classname" placeholder="Lớp..." required>
  </div>

  <form id="quizForm">
    <!-- Câu 1 -->
    <div class="question-card">
      <div class="question-title">Câu 1: Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = x(x-1)^2$. Số điểm cực trị của hàm số đã cho là:</div>
      <div class="options">
        <label><input type="radio" name="q1" value="A"> A. $0$</label>
        <label><input type="radio" name="q1" value="B"> B. $1$</label>
        <label><input type="radio" name="q1" value="C"> C. $2$</label>
        <label><input type="radio" name="q1" value="D"> D. $3$</label>
      </div>
    </div>

    <!-- Câu 2 -->
    <div class="question-card">
      <div class="question-title">Câu 2: Trong không gian $Oxyz$, mặt cầu $(S): (x-1)^2 + (y+2)^2 + (z-3)^2 = 16$ có bán kính bằng:</div>
      <div class="options">
        <label><input type="radio" name="q2" value="A"> A. $4$</label>
        <label><input type="radio" name="q2" value="B"> B. $16$</label>
        <label><input type="radio" name="q2" value="C"> C. $2$</label>
        <label><input type="radio" name="q2" value="D"> D. $8$</label>
      </div>
    </div>

    <button type="button" id="btnSubmit" class="submit-btn" onclick="chamDiemVaGui()">Nộp Bài</button>
  </form>

  <div id="result-box"></div>
</div>

<script>
  // Link Apps Script của bạn
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmV_0WaIHlMNdL1Ygj6Y3khwMAVqoOVAhf5D9WWuwavOoYoMR5ChGC67Gxc5fQ-KIEiw/exec";

  // Đáp án chuẩn
  const DAPAN = { 
    q1: "B", 
    q2: "A" 
  };

  async function chamDiemVaGui() {
    let ten = document.getElementById("fullname").value.trim();
    let lop = document.getElementById("classname").value.trim();
    let btn = document.getElementById("btnSubmit");
    let resultBox = document.getElementById("result-box");

    if (!ten || !lop) {
      alert("Vui lòng điền đầy đủ Họ tên và Lớp trước khi nộp bài!");
      return;
    }

    // Tính điểm
    let dung = 0;
    let tong = Object.keys(DAPAN).length;

    for (let key in DAPAN) {
      let selected = document.querySelector(`input[name="${key}"]:checked`);
      if (selected && selected.value === DAPAN[key]) {
        dung++;
      }
    }

    let diem = (dung / tong) * 10;
    
    // Khóa nút để tránh nộp nhiều lần
    btn.disabled = true;
    btn.innerText = "Đang lưu kết quả về hệ thống...";

    let now = new Date().toLocaleString("vi-VN");
    let payload = {
      thoiGian: now,
      hoTen: ten,
      lop: lop,
      soCauDung: `${dung}/${tong}`,
      diemSo: diem.toFixed(1)
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      resultBox.style.display = "block";
      resultBox.innerHTML = `
        🎉 <strong>Nộp bài thành công!</strong><br>
        Học sinh: <strong>${ten}</strong> - Lớp: <strong>${lop}</strong><br>
        Kết quả: <strong>${dung}/${tong}</strong> câu đúng<br>
        Điểm số: <span style="font-size: 24px; color: #d93025;">${diem.toFixed(1)} / 10</span><br>
        <small style="color: #666;">(Kết quả đã được tự động lưu vào bảng điểm)</small>
      `;
      btn.innerText = "Đã nộp bài";
    } catch (err) {
      alert("Có lỗi khi gửi dữ liệu, bạn hãy kiểm tra kết nối mạng!");
      btn.disabled = false;
      btn.innerText = "Nộp Bài";
    }

    resultBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
